name = "polystats-proxy"
main = "index.ts"
compatibility_date = "2024-12-01"

# Deployed via Cloudflare Workers Builds (Git integration) or `npx wrangler deploy`.
# The app expects this worker to be reachable at:
#   https://polystats-proxy.<your-subdomain>.workers.dev/?url=<encoded api url>

# Player catalog database (managed via Workers Builds auto-deploy).
[[d1_databases]]
binding = "DB"
database_name = "polystats-catalog"
database_id = "aa05debf-904d-4daa-9ad7-4c2ac9debf88"

# Five cron jobs (free tier max is 5 — fully used):
#  - */15:     WR watch — top-1 of all 63 tracks; writes only when a record falls
#  - 0 */6:    full top-50 snapshot of all 63 tracks + TOTW archive
#  - 0 6/12/18: backfill x3/day — 6 tracks x 750 players each = ~13.5k players/day
# Budget: ~65-70k D1 writes/day of the 100k/day free allowance.
[triggers]
crons = ["*/15 * * * *", "0 */6 * * *", "0 6 * * *", "0 12 * * *", "0 18 * * *"]
