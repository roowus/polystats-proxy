name = "polystats-proxy"
main = "index.ts"
compatibility_date = "2024-12-01"

# Deployed via Cloudflare Workers Builds (Git integration) or `npx wrangler deploy`.
# The app expects this worker to be reachable at:
#   https://polystats-proxy.<your-subdomain>.workers.dev/?url=<encoded api url>

# Player catalog database (managed via Workers Builds auto-deploy).
[[d1_databases]]
binding = "DB"
database_name = "polystats-catalog"
database_id = "aa05debf-904d-4daa-9ad7-4c2ac9debf88"

# Three cron jobs (free tier allows 5):
#  - */15: WR watch — top-1 of every track (official + community + TOTW);
#          writes only when a record is broken (~0-150 writes/day)
#  - 0 */6: full top-50 snapshot of every track + TOTW archive (~8k writes/run)
#  - 0 6:   daily backfill — deep-crawl 6 tracks x 500 players (~3k writes)
# Budget: ~35-45k D1 writes/day of the 100k/day free allowance.
[triggers]
crons = ["*/15 * * * *", "0 */6 * * *", "0 6 * * *"]
