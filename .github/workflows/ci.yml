name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check worker
        run: npx -y tsc --noEmit --target es2022 --lib es2022,webworker --module esnext --moduleResolution bundler --strict worker/index.ts
